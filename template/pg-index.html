<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Graham Essays · FrankMiao</title>
<style>
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-elevated: #21262d;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
  --amber: #e8a838; --amber-dim: rgba(232,168,56,0.1);
  --mono: 'JetBrains Mono','Courier New',monospace;
  --sans: -apple-system,'Inter','Segoe UI',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); }
a { color: inherit; text-decoration: none; }

.header { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 1rem; }
.logo { font-weight: 700; font-size: 0.95rem; color: var(--amber); display: flex; align-items: center; gap: 0.6rem; }
.logo-mark { width: 26px; height: 26px; background: var(--amber); color: #0d1117; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }
.nav-links { display: flex; gap: 0; margin-left: auto; }
.nav-links a { padding: 0 1rem; height: 52px; display: flex; align-items: center; font-size: 0.875rem; color: var(--text-muted); }
.nav-links a:hover { color: var(--text); }

.page-header { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem 2rem; }
.page-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
.page-title span { color: var(--amber); }
.page-sub { color: var(--text-muted); font-size: 0.95rem; }
.progress-bar { margin-top: 1.5rem; background: var(--bg-elevated); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--amber); border-radius: 4px; }
.progress-label { font-size: 0.75rem; color: var(--text-muted); font-family: var(--mono); margin-top: 6px; }

.controls { max-width: 1200px; margin: 0 auto; padding: 0 2rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.cat-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.cat-btn { padding: 5px 14px; border-radius: 100px; border: 1px solid var(--border); background: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
.cat-btn.active, .cat-btn:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
.search-box { margin-left: auto; }
.search-input { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--text); font-size: 0.85rem; width: 220px; }
.search-input:focus { outline: none; border-color: var(--amber); }
.search-input::placeholder { color: var(--text-muted); }

.grid { max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.pg-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; transition: border-color 0.15s, transform 0.1s; }
.pg-card:hover { border-color: var(--amber); transform: translateY(-2px); }
.pg-card[hidden] { display: none; }
.pg-card-cat { font-size: 0.7rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 0.5rem; }
.pg-card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 0.5rem; }
.pg-card-meta { font-size: 0.75rem; color: var(--text-muted); font-family: var(--mono); }

@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 580px) { .grid { grid-template-columns: 1fr; } .search-box { width: 100%; } .search-input { width: 100%; } }
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><div class="logo-mark">F</div>FrankMiao</a>
  <nav class="nav-links">
    <a href="/">首页</a>
    <a href="/crypto.html">加密日报</a>
    <a href="/intel.html">一级情报</a>
  </nav>
</header>

<div class="page-header">
  <h1 class="page-title">Paul Graham <span>Essays</span></h1>
  <p class="page-sub">精读 PG 的创业、投资、技术思想，提炼中文精华</p>
  <div class="progress-bar">
    <div class="progress-fill" style="width: {{pgCount}}%"></div>
  </div>
  <div class="progress-label">已归档 {{pgCount}} / 233 篇</div>
</div>

<div class="controls">
  <div class="cat-filters">
    {{catBtns}}
  </div>
  <div class="search-box">
    <input type="text" class="search-input" placeholder="搜索文章... (/)" id="searchInput">
  </div>
</div>

<div class="grid" id="pgGrid">
  {{pgCards}}
</div>

<script>
const catBtns = document.querySelectorAll('.cat-btn');
const cards = document.querySelectorAll('.pg-card');
let activeCat = '全部';
let searchQ = '';

function filter() {
  cards.forEach(c => {
    const cat = c.dataset.cat;
    const title = c.querySelector('.pg-card-title').textContent.toLowerCase();
    const catOk = activeCat === '全部' || cat === activeCat;
    const searchOk = !searchQ || title.includes(searchQ);
    c.hidden = !(catOk && searchOk);
  });
}

catBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    catBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    filter();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase();
  filter();
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});
</script>
</body>
</html>
