<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} · FrankMiao</title>
<style>
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-elevated: #21262d;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
  --amber: #e8a838; --amber-dim: rgba(232,168,56,0.1);
  --blue: #58a6ff; --green: #3fb950;
  --mono: 'JetBrains Mono','Courier New',monospace;
  --sans: -apple-system,'Inter','Segoe UI',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; }
a { color: var(--amber); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Progress bar */
#progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--amber); z-index: 200; width: 0; transition: width 0.1s; }

/* Header */
.header { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 1rem; }
.logo { font-weight: 700; font-size: 0.95rem; color: var(--amber); display: flex; align-items: center; gap: 0.6rem; }
.logo-mark { width: 26px; height: 26px; background: var(--amber); color: #0d1117; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }
.breadcrumb { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; }
.breadcrumb a { color: var(--text-muted); }
.breadcrumb a:hover { color: var(--text); text-decoration: none; }

/* Layout */
.layout { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; display: grid; grid-template-columns: 1fr 280px; gap: 3rem; align-items: start; }

/* Article */
.article-header { margin-bottom: 2rem; }
.article-cat { display: inline-block; font-size: 0.7rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.75rem; }
.article-title { font-size: 2rem; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; margin-bottom: 1rem; }
.article-meta { font-family: var(--mono); font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 1.5rem; flex-wrap: wrap; }
.tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
.tag { font-size: 0.7rem; padding: 2px 10px; border-radius: 100px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }

/* Summary */
.summary-block { background: var(--amber-dim); border: 1px solid rgba(232,168,56,0.25); border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0; padding: 1.5rem; margin-bottom: 2rem; }
.summary-label { font-size: 0.7rem; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem; }
.summary-block p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.7; }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 2rem; gap: 0; }
.tab-btn { padding: 0.6rem 1.25rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; transition: color 0.15s, border-color 0.15s; }
.tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Markdown body */
.md-body h1,.md-body h2,.md-body h3,.md-body h4 { color: var(--text); margin: 2rem 0 0.75rem; font-weight: 700; line-height: 1.3; }
.md-body h2 { font-size: 1.35rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
.md-body h3 { font-size: 1.1rem; color: var(--amber); }
.md-body p { margin-bottom: 1rem; color: #c9d1d9; }
.md-body blockquote { border-left: 3px solid var(--amber); padding: 0.75rem 1.25rem; margin: 1.5rem 0; background: var(--amber-dim); border-radius: 0 6px 6px 0; }
.md-body blockquote p { margin: 0; color: var(--text-muted); font-style: italic; }
.md-body code { font-family: var(--mono); font-size: 0.85em; background: var(--bg-elevated); padding: 2px 6px; border-radius: 4px; color: #f0883e; }
.md-body pre { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; overflow-x: auto; margin: 1.5rem 0; }
.md-body pre code { background: none; padding: 0; color: #c9d1d9; }
.md-body ul,.md-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
.md-body li { margin-bottom: 0.35rem; color: #c9d1d9; }
.md-body table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; }
.md-body th { background: var(--bg-elevated); padding: 0.5rem 0.75rem; text-align: left; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; }
.md-body td { padding: 0.5rem 0.75rem; border: 1px solid var(--border); }
.md-body strong { color: var(--text); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

/* Sidebar */
.sidebar { position: sticky; top: 70px; }
.sidebar-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
.sidebar-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 1rem; font-weight: 700; }
.meta-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
.meta-row:last-child { border-bottom: none; }
.meta-key { color: var(--text-muted); }
.meta-val { color: var(--text); font-family: var(--mono); }
.orig-link { display: block; margin-top: 0.75rem; padding: 0.5rem 1rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; color: var(--blue); text-align: center; }
.orig-link:hover { border-color: var(--blue); text-decoration: none; }
.related-item { display: flex; flex-direction: column; gap: 2px; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
.related-item:last-child { border-bottom: none; }
.related-title { font-size: 0.85rem; color: var(--text); line-height: 1.3; }
.related-cat { font-size: 0.7rem; color: var(--amber); }
.related-item:hover .related-title { color: var(--amber); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .article-title { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div id="progress"></div>

<header class="header">
  <a href="/" class="logo"><div class="logo-mark">F</div>FrankMiao</a>
  <div class="breadcrumb">
    <a href="/pg.html">PG Essays</a>
    <span>/</span>
    <span>{{category}}</span>
    <span>/</span>
    <span>{{title}}</span>
  </div>
</header>

<div class="layout">
  <main>
    <div class="article-header">
      <div class="article-cat">{{category}}</div>
      <h1 class="article-title">{{title}}</h1>
      <div class="article-meta">
        <span>{{date}}</span>
        <span>约 {{readTime}} 分钟</span>
        <span>{{wordCount}} 字</span>
      </div>
      <div class="tags">{{tags}}</div>
    </div>

    <div class="summary-block">
      <div class="summary-label">📌 精要摘要</div>
      <div class="md-body">{{summary}}</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('zh')">🇨🇳 中文全文</button>
      <button class="tab-btn" onclick="switchTab('orig')">🔗 原文链接</button>
    </div>

    <div id="tab-zh" class="tab-content active">
      <div class="md-body">{{zhContent}}</div>
    </div>
    <div id="tab-orig" class="tab-content">
      <p style="color:var(--text-muted);margin-bottom:1rem">查看 Paul Graham 原文：</p>
      <a href="{{originalUrl}}" target="_blank" rel="noopener" class="orig-link" style="font-size:0.9rem;display:block;padding:1rem;">
        {{originalUrl}} ↗
      </a>
    </div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-label">文章信息</div>
      <div class="meta-row"><span class="meta-key">分类</span><span class="meta-val">{{category}}</span></div>
      <div class="meta-row"><span class="meta-key">日期</span><span class="meta-val">{{date}}</span></div>
      <div class="meta-row"><span class="meta-key">字数</span><span class="meta-val">{{wordCount}}</span></div>
      <div class="meta-row"><span class="meta-key">阅读</span><span class="meta-val">{{readTime}}min</span></div>
      <a href="{{originalUrl}}" target="_blank" class="orig-link">查看英文原文 ↗</a>
    </div>
    <div class="sidebar-card">
      <div class="sidebar-label">同类文章</div>
      {{relatedArticles}}
    </div>
  </aside>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='zh')||(i===1&&tab==='orig')));
  document.getElementById('tab-zh').classList.toggle('active', tab==='zh');
  document.getElementById('tab-orig').classList.toggle('active', tab==='orig');
}
window.addEventListener('scroll', () => {
  const el = document.documentElement;
  const pct = el.scrollTop / (el.scrollHeight - el.clientHeight) * 100;
  document.getElementById('progress').style.width = pct + '%';
});
</script>
</body>
</html>
