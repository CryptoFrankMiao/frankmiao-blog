<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - PG Essays 中文站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-hover: #222222;
            --bg-code: #1e1e1e;
            --text-primary: #fafafa;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent: #22c55e;
            --accent-light: #4ade80;
            --border: #2a2a2a;
            --border-light: #333333;
            --shadow: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.5);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--accent);
            z-index: 1000;
            transition: width 0.1s;
            width: 0%;
        }

        /* Header */
        header {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: var(--bg-primary);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .home-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .home-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .home-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Layout */
        .article-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 4rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        /* Article Header */
        .article-header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .article-meta-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .article-date, .article-read-time, .article-word-count {
            color: var(--text-muted);
        }

        .article-meta-divider {
            color: var(--border-light);
        }

        .article-tags {
            display: flex;
            gap: 0.5rem;
        }

        .tag {
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
        }

        .article-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .article-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Article Content */
        .article-content {
            max-width: 100%;
        }

        .article-content h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 3rem 0 1.25rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            scroll-margin-top: 100px;
        }

        .article-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 2rem 0 0.75rem;
            color: var(--text-primary);
            scroll-margin-top: 100px;
        }

        .article-content p {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .article-content ul, .article-content ol {
            margin: 1.25rem 0 1.5rem 1.5rem;
            color: var(--text-secondary);
        }

        .article-content li {
            margin-bottom: 0.75rem;
        }

        .article-content li::marker {
            color: var(--accent);
        }

        .article-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-muted);
        }

        .article-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .article-content code {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            background: var(--bg-code);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--accent-light);
        }

        .article-content pre {
            background: var(--bg-code);
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        .article-content pre code {
            background: transparent;
            color: var(--text-secondary);
            padding: 0;
        }

        .article-content a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .article-content a:hover {
            border-bottom-color: var(--accent);
        }

        .article-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 3rem 0;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: var(--text-secondary);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Sections */
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .section-label::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
        }

        .content-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin: 2rem 0;
        }

        .content-section h2 {
            margin-top: 0;
        }

        /* Table of Contents Sidebar */
        .toc-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .toc-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .toc-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toc-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
        }

        .toc-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .toc-list li {
            margin: 0;
            padding: 0;
        }

        .toc-list a {
            display: block;
            padding: 0.5rem 0;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            border-left: 2px solid transparent;
            padding-left: 1rem;
            margin-left: -1rem;
            transition: all 0.2s;
        }

        .toc-list a:hover {
            color: var(--text-primary);
            border-left-color: var(--accent);
        }

        .toc-list a.active {
            color: var(--accent);
            border-left-color: var(--accent);
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 5rem;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .article-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .toc-sidebar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                padding: 0 1.25rem;
            }

            .article-layout {
                padding: 5rem 1.25rem 3rem;
            }

            .article-header h1 {
                font-size: 1.75rem;
            }

            .article-subtitle {
                font-size: 1rem;
            }

            .content-section {
                padding: 1.5rem;
            }

            .article-content h2 {
                font-size: 1.35rem;
            }

            .article-content h3 {
                font-size: 1.15rem;
            }

            .tab-nav {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab-btn {
                white-space: nowrap;
            }

            .logo-text {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    
    <header>
        <div class="header-content">
            <a href="/" class="logo">
                <span class="logo-icon">PG</span>
                <span class="logo-text">Essays 中文站</span>
            </a>
            <a href="/" class="home-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                返回文章列表
            </a>
        </div>
    </header>

    <div class="article-layout">
        <article>
            <header class="article-header">
                <div class="article-meta-top">
                    <span class="article-date">{{DATE}}</span>
                    <span class="article-meta-divider">·</span>
                    <span class="article-read-time">{{READ_TIME}}分钟阅读</span>
                    <span class="article-meta-divider">·</span>
                    <span class="article-word-count">{{WORD_COUNT}}字</span>
                    <div class="article-tags">
                        {{TAGS}}
                    </div>
                </div>
                <h1>{{TITLE}}</h1>
                <p class="article-subtitle">{{SUBTITLE}}</p>
            </header>

            <!-- Tab Navigation -->
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('translation')">中文翻译</button>
                <button class="tab-btn" onclick="switchTab('original')">英文原文</button>
                <button class="tab-btn" onclick="switchTab('notes')">学习笔记</button>
            </div>

            <div class="article-content">
                {{CONTENT}}
            </div>
        </article>

        <aside class="toc-sidebar">
            <div class="toc-card">
                <div class="toc-title">文章目录</div>
                <ul class="toc-list" id="tocList">
                    <li><a href="#translation" class="active">中文翻译</a></li>
                    <li><a href="#original">英文原文</a></li>
                    <li><a href="#notes">学习笔记</a></li>
                </ul>
            </div>
        </aside>
    </div>

    <footer>
        <div class="footer-content">
            <p>学习笔记 · 内容源自 <a href="http://paulgraham.com">paulgraham.com</a></p>
        </div>
    </footer>

    <script>
        // Progress bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progressBar').style.width = scrolled + '%';
        });

        // Tab switching
        function switchTab(tabName) {
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');

            // Update TOC
            document.querySelectorAll('.toc-list a').forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector(`.toc-list a[href="#${tabName}"]`).classList.add('active');
        }

        // TOC active state
        const tocLinks = document.querySelectorAll('.toc-list a');
        tocLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const tabName = link.getAttribute('href').substring(1);
                
                // Trigger tab switch
                const tabBtn = document.querySelector(`.tab-btn:nth-child(${tabName === 'translation' ? 1 : tabName === 'original' ? 2 : 3})`);
                if (tabBtn) tabBtn.click();
            });
        });
    </script>
</body>
</html>
