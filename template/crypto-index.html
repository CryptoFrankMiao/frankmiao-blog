<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加密市场日报 · FrankMiao</title>
<style>
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-elevated: #21262d;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
  --blue: #58a6ff; --blue-dim: rgba(88,166,255,0.1);
  --green: #3fb950; --red: #f85149; --amber: #e8a838;
  --mono: 'JetBrains Mono','Courier New',monospace;
  --sans: -apple-system,'Inter','Segoe UI',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); }
a { color: inherit; text-decoration: none; }

.header { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 1rem; }
.logo { font-weight: 700; font-size: 0.95rem; color: var(--amber); display: flex; align-items: center; gap: 0.6rem; }
.logo-mark { width: 26px; height: 26px; background: var(--amber); color: #0d1117; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }
.nav-links { display: flex; gap: 0; margin-left: auto; }
.nav-links a { padding: 0 1rem; height: 52px; display: flex; align-items: center; font-size: 0.875rem; color: var(--text-muted); }

.page-header { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem 2rem; }
.page-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
.page-title span { color: var(--blue); }
.page-sub { color: var(--text-muted); font-size: 0.95rem; }
.count { font-family: var(--mono); color: var(--blue); font-size: 0.85rem; margin-top: 0.5rem; }

.table-wrap { max-width: 1000px; margin: 0 auto; padding: 0 2rem 4rem; }
.crypto-table { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.crypto-header { display: grid; grid-template-columns: 130px 150px 110px 80px 1fr; padding: 0.75rem 1.25rem; background: var(--bg-elevated); font-size: 0.72rem; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
.crypto-row { display: grid; grid-template-columns: 130px 150px 110px 80px 1fr; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; align-items: center; transition: background 0.1s; }
.crypto-row:last-child { border-bottom: none; }
.crypto-row:hover { background: var(--bg-elevated); }
.cr-date { font-family: var(--mono); color: var(--text-muted); font-size: 0.82rem; }
.cr-price { font-family: var(--mono); font-weight: 700; color: var(--blue); }
.cr-change { font-family: var(--mono); font-weight: 600; }
.cr-change.pos { color: var(--green); }
.cr-change.neg { color: var(--red); }
.cr-fgi { font-family: var(--mono); color: var(--text-muted); }
.cr-hl { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 700px) {
  .crypto-header, .crypto-row { grid-template-columns: 100px 130px 90px 1fr; }
  .cr-hl { display: none; }
}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><div class="logo-mark">F</div>FrankMiao</a>
  <nav class="nav-links">
    <a href="/">首页</a>
    <a href="/pg.html">PG Essays</a>
    <a href="/intel.html">一级情报</a>
  </nav>
</header>

<div class="page-header">
  <h1 class="page-title">加密市场<span>日报</span></h1>
  <p class="page-sub">每日加密市场复盘 · BTC 价格 · 恐惧贪婪指数 · 关键事件</p>
  <div class="count">共 {{cryptoCount}} 期</div>
</div>

<div class="table-wrap">
  <div class="crypto-table">
    <div class="crypto-header">
      <span>日期</span><span>BTC 价格</span><span>24h 涨跌</span><span>FGI</span><span>头条</span>
    </div>
    {{cryptoRows}}
  </div>
</div>
</body>
</html>
