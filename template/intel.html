<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} · FrankMiao</title>
<style>
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-elevated: #21262d;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
  --green: #3fb950; --green-dim: rgba(63,185,80,0.1);
  --amber: #e8a838; --blue: #58a6ff;
  --mono: 'JetBrains Mono','Courier New',monospace;
  --sans: -apple-system,'Inter','Segoe UI',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; }
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; }

.header { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 1rem; }
.logo { font-weight: 700; font-size: 0.95rem; color: var(--amber); display: flex; align-items: center; gap: 0.6rem; }
.logo-mark { width: 26px; height: 26px; background: var(--amber); color: #0d1117; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }

.container { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem; }
.intel-header { margin-bottom: 2.5rem; }
.intel-label { font-size: 0.7rem; color: var(--green); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.5rem; }
.intel-date { font-family: var(--mono); font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.75rem; }
.intel-title { font-size: 1.8rem; font-weight: 800; line-height: 1.25; margin-bottom: 1rem; }
.intel-meta { display: flex; gap: 1.5rem; font-size: 0.82rem; color: var(--text-muted); font-family: var(--mono); flex-wrap: wrap; }
.tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
.tag { font-size: 0.7rem; padding: 2px 10px; border-radius: 100px; background: var(--green-dim); border: 1px solid rgba(63,185,80,0.3); color: var(--green); }

.divider { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

.md-body h1,.md-body h2,.md-body h3 { color: var(--text); margin: 2rem 0 0.75rem; font-weight: 700; }
.md-body h2 { font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; color: var(--green); }
.md-body h3 { font-size: 1rem; }
.md-body p { margin-bottom: 1rem; color: #c9d1d9; }
.md-body ul,.md-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
.md-body li { margin-bottom: 0.4rem; color: #c9d1d9; }
.md-body strong { color: var(--text); }
.md-body blockquote { border-left: 3px solid var(--green); padding: 0.75rem 1.25rem; margin: 1.5rem 0; background: var(--green-dim); border-radius: 0 6px 6px 0; }
.md-body blockquote p { margin: 0; color: var(--text-muted); }
.md-body code { font-family: var(--mono); font-size: 0.85em; background: var(--bg-elevated); padding: 2px 6px; border-radius: 4px; color: var(--green); }
.md-body table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.88rem; }
.md-body th { background: var(--bg-elevated); padding: 0.5rem 0.75rem; text-align: left; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.78rem; }
.md-body td { padding: 0.5rem 0.75rem; border: 1px solid var(--border); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

.back-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 3rem; font-size: 0.85rem; color: var(--text-muted); }
.back-link:hover { color: var(--green); text-decoration: none; }
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><div class="logo-mark">F</div>FrankMiao</a>
</header>
<div class="container">
  <div class="intel-header">
    <div class="intel-label">🏦 一级市场情报</div>
    <div class="intel-date">{{date}}</div>
    <h1 class="intel-title">{{title}}</h1>
    <div class="intel-meta">
      <span>机构: {{funds}}</span>
      <span>条目: {{entryCount}}</span>
    </div>
    <div class="tags">{{tags}}</div>
  </div>
  <hr class="divider">
  <div class="md-body">{{body}}</div>
  <a href="/intel.html" class="back-link">← 返回情报列表</a>
</div>
</body>
</html>
