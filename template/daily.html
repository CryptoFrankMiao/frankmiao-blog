<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{date}} 加密日报 · FrankMiao</title>
<style>
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-elevated: #21262d;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
  --blue: #58a6ff; --blue-dim: rgba(88,166,255,0.1);
  --green: #3fb950; --red: #f85149; --amber: #e8a838;
  --mono: 'JetBrains Mono','Courier New',monospace;
  --sans: -apple-system,'Inter','Segoe UI',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.7; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

.header { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 1rem; }
.logo { font-weight: 700; font-size: 0.95rem; color: var(--amber); display: flex; align-items: center; gap: 0.6rem; }
.logo-mark { width: 26px; height: 26px; background: var(--amber); color: #0d1117; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }
.breadcrumb { font-size: 0.8rem; color: var(--text-muted); }
.breadcrumb a { color: var(--text-muted); }

.container { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem; }
.date-header { margin-bottom: 2rem; }
.date-label { font-size: 0.7rem; color: var(--blue); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.5rem; }
.date-title { font-size: 2rem; font-weight: 800; font-family: var(--mono); }

/* Market snapshot */
.snapshot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
.snap-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; border-top: 3px solid var(--blue); }
.snap-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
.snap-value { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--blue); }
.snap-value.pos { color: var(--green); }
.snap-value.neg { color: var(--red); }

/* Body */
.md-body h1,.md-body h2,.md-body h3 { color: var(--text); margin: 2rem 0 0.75rem; font-weight: 700; }
.md-body h2 { font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; color: var(--blue); }
.md-body h3 { font-size: 1rem; }
.md-body p { margin-bottom: 1rem; color: #c9d1d9; }
.md-body ul,.md-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
.md-body li { margin-bottom: 0.35rem; color: #c9d1d9; }
.md-body strong { color: var(--text); }
.md-body blockquote { border-left: 3px solid var(--blue); padding: 0.75rem 1.25rem; margin: 1.5rem 0; background: var(--blue-dim); border-radius: 0 6px 6px 0; }
.md-body blockquote p { margin: 0; color: var(--text-muted); }
.md-body code { font-family: var(--mono); font-size: 0.85em; background: var(--bg-elevated); padding: 2px 6px; border-radius: 4px; color: var(--blue); }
.md-body table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.88rem; }
.md-body th { background: var(--bg-elevated); padding: 0.5rem 0.75rem; text-align: left; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.78rem; }
.md-body td { padding: 0.5rem 0.75rem; border: 1px solid var(--border); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

/* Nav */
.daily-nav { display: flex; justify-content: space-between; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.nav-link { font-size: 0.85rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
.nav-link:hover { color: var(--blue); text-decoration: none; }
.nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
.nav-date { font-family: var(--mono); color: var(--blue); }

@media (max-width: 600px) {
  .snapshot { grid-template-columns: 1fr; }
  .date-title { font-size: 1.4rem; }
}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><div class="logo-mark">F</div>FrankMiao</a>
  <div class="breadcrumb">
    <a href="/crypto.html">加密日报</a> / <span>{{date}}</span>
  </div>
</header>

<div class="container">
  <div class="date-header">
    <div class="date-label">📊 加密市场日报</div>
    <div class="date-title">{{date}}</div>
  </div>

  <div class="snapshot">
    <div class="snap-card">
      <div class="snap-label">BTC 价格</div>
      <div class="snap-value">{{btcPrice}}</div>
    </div>
    <div class="snap-card">
      <div class="snap-label">24h 涨跌</div>
      <div class="snap-value">{{change}}</div>
    </div>
    <div class="snap-card">
      <div class="snap-label">恐惧贪婪指数</div>
      <div class="snap-value">{{fgi}}</div>
    </div>
  </div>

  <div class="md-body">{{body}}</div>

  <div class="daily-nav">
    <div>
      {{#prevLink}}<a href="{{prevLink}}" class="nav-link"><span class="nav-label">← 上一篇</span><span class="nav-date">{{prevDate}}</span></a>{{/prevLink}}
    </div>
    <div>
      {{#nextLink}}<a href="{{nextLink}}" class="nav-link" style="text-align:right"><span class="nav-label">下一篇 →</span><span class="nav-date">{{nextDate}}</span></a>{{/nextLink}}
    </div>
  </div>
</div>
</body>
</html>
