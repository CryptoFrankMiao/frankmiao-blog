<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一级市场情报 · FrankMiao</title>
<style>
:root {
  --bg: #0d1117; --bg-surface: #161b22; --bg-elevated: #21262d;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
  --green: #3fb950; --green-dim: rgba(63,185,80,0.1);
  --amber: #e8a838;
  --mono: 'JetBrains Mono','Courier New',monospace;
  --sans: -apple-system,'Inter','Segoe UI',sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); }
a { color: inherit; text-decoration: none; }

.header { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 1rem; }
.logo { font-weight: 700; font-size: 0.95rem; color: var(--amber); display: flex; align-items: center; gap: 0.6rem; }
.logo-mark { width: 26px; height: 26px; background: var(--amber); color: #0d1117; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }
.nav-links { display: flex; gap: 0; margin-left: auto; }
.nav-links a { padding: 0 1rem; height: 52px; display: flex; align-items: center; font-size: 0.875rem; color: var(--text-muted); }

.page-header { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem 2rem; }
.page-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
.page-title span { color: var(--green); }
.page-sub { color: var(--text-muted); font-size: 0.95rem; }
.count { font-family: var(--mono); color: var(--green); font-size: 0.85rem; margin-top: 0.5rem; }

.table-wrap { max-width: 1000px; margin: 0 auto; padding: 0 2rem 4rem; }
.intel-table { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.intel-header { display: grid; grid-template-columns: 120px 1fr 200px 80px; padding: 0.75rem 1.25rem; background: var(--bg-elevated); font-size: 0.72rem; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
.intel-row { display: grid; grid-template-columns: 120px 1fr 200px 80px; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); align-items: center; transition: background 0.1s; }
.intel-row:last-child { border-bottom: none; }
.intel-row:hover { background: var(--bg-elevated); border-color: var(--green); }
.ir-date { font-family: var(--mono); color: var(--green); font-size: 0.82rem; }
.ir-title { font-weight: 600; font-size: 0.9rem; }
.intel-row:hover .ir-title { color: var(--green); }
.ir-funds { font-size: 0.8rem; color: var(--text-muted); }
.ir-count { font-family: var(--mono); font-size: 0.82rem; color: var(--text-muted); }

@media (max-width: 700px) {
  .intel-header, .intel-row { grid-template-columns: 100px 1fr; }
  .ir-funds, .ir-count { display: none; }
}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><div class="logo-mark">F</div>FrankMiao</a>
  <nav class="nav-links">
    <a href="/">首页</a>
    <a href="/pg.html">PG Essays</a>
    <a href="/crypto.html">加密日报</a>
  </nav>
</header>

<div class="page-header">
  <h1 class="page-title">一级市场<span>情报</span></h1>
  <p class="page-sub">PE/VC 融资动态 · 机构动向 · 投资趋势追踪</p>
  <div class="count">共 {{intelCount}} 期</div>
</div>

<div class="table-wrap">
  <div class="intel-table">
    <div class="intel-header">
      <span>日期</span><span>标题</span><span>机构</span><span>条目</span>
    </div>
    {{intelRows}}
  </div>
</div>
</body>
</html>
